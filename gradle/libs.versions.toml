material = { group = "com.google.android.material", name = "material", version.ref = "material" }


koin-core = {module= "io.insert-koin:koin-core" , version.ref = "koin"}
koin-android = {module="io.insert-koin:koin-android", version.ref="koin"}
koin-android-compose = {module = "io.insert-koin:koin-androidx-compose", version.ref = "koin"}


#Ktor
ktor-client-core = {module = "io.ktor:ktor-client-core", version.ref = "ktor"}
ktor-client-cio = {module = "io.ktor:ktor-client-cio" ,version.ref = "ktor"}
ktor-client-logging = {module= "io.ktor:ktor-client-logging" , version.ref = "ktor"}
ktor-client-content-negotiation = {module = "io.ktor:ktor-client-content-negotiation " , version.ref = "ktor"}
ktor-serialization-kotlinx-json = {module = "io.ktor:ktor-serialization-kotlinx-json" , version.ref = "ktor"}


compose-navigation = {module="androidx.navigation:navigation-compose" , version.ref = "navigationCompose"}
androidx-animation = {module ="androidx.compose.animation:animation" , version.ref = "animation" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }

# unit test
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockitoCore" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockitoInline" }
